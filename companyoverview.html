<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0">
	<link href="assets/css/stylev12-dark.css" rel="stylesheet">
	<style>
		/* === PRODUCT NAV === */
		.product-nav {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 100;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background-color: #000000;
			padding: 0 40px;
			height: 56px;
		}
		.product-nav-logo {
			height: 32px;
			flex-shrink: 0;
		}
		.product-nav-tabs {
			display: flex;
			align-items: center;
			height: 100%;
			gap: 0;
		}
		.product-nav-tab {
			font-family: var(--font-medium);
			font-size: 16px;
			color: rgba(255,255,255,0.55);
			text-decoration: none;
			padding: 0 24px;
			height: 100%;
			display: flex;
			align-items: center;
			border-bottom: 2px solid transparent;
			transition: color 0.2s ease, border-color 0.2s ease;
			white-space: nowrap;
			-webkit-tap-highlight-color: transparent;
		}
		.product-nav-tab:hover,
		.product-nav-tab:active {
			color: #FFFFFF;
		}
		.product-nav-tab.active {
			color: #FFEA9E;
			border-bottom-color: #FFEA9E;
		}
		/* === PRODUCTS DROPDOWN === */
		.nav-dropdown {
			position: relative;
			height: 100%;
			display: flex;
			align-items: center;
		}
		.nav-dropdown-toggle {
			font-family: var(--font-medium);
			font-size: 16px;
			color: rgba(255,255,255,0.55);
			background: none;
			border: none;
			padding: 0 24px;
			height: 100%;
			display: flex;
			align-items: center;
			gap: 6px;
			cursor: pointer;
			white-space: nowrap;
			-webkit-tap-highlight-color: transparent;
			transition: color 0.2s ease;
		}
		.nav-dropdown-toggle:hover,
		.nav-dropdown-toggle:active {
			color: #FFFFFF;
		}
		.nav-dropdown-toggle.has-active {
			color: #FFEA9E;
		}
		.nav-dropdown-toggle svg {
			width: 10px;
			height: 6px;
			fill: currentColor;
			transition: transform 0.2s ease;
		}
		.nav-dropdown.open .nav-dropdown-toggle svg {
			transform: rotate(180deg);
		}
		.nav-dropdown-menu {
			display: none;
			position: absolute;
			top: 100%;
			left: 0;
			background-color: #000000;
			min-width: 180px;
			padding: 8px 0;
		}
		.nav-dropdown.open .nav-dropdown-menu {
			display: block;
		}
		.nav-dropdown-menu a {
			font-family: var(--font-medium);
			font-size: 15px;
			color: rgba(255,255,255,0.55);
			text-decoration: none;
			display: block;
			padding: 10px 24px;
			white-space: nowrap;
			transition: color 0.2s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.nav-dropdown-menu a:hover,
		.nav-dropdown-menu a:active {
			color: #FFFFFF;
		}
		.nav-dropdown-menu a.active {
			color: #FFEA9E;
		}
		.product-nav-cta {
			flex-shrink: 0;
			visibility: hidden;
		}
		.product-nav-cta a {
			font-family: var(--font-medium);
			font-size: 14px;
			color: #FFFFFF;
			text-decoration: none;
			border: 1px solid #FFFFFF;
			padding: 8px 20px;
			white-space: nowrap;
		}
		/* === SLIDES === */
		.slides {
			padding-top: 56px;
			background-color: #000000;
		}
		.slides img {
			width: 100%;
			display: block;
		}
	</style>
	<title>Doodle Labs - Company Overview</title>
</head>
<body>
	<nav class="product-nav">
		<img src="assets/images/Logo-Stacked.svg" class="product-nav-logo" alt="Doodle Labs">
		<div class="product-nav-tabs">
			<a href="bigpicture.html" class="product-nav-tab">Big Picture</a>
			<a href="companyoverview.html" class="product-nav-tab active">Company Overview</a>
			<div class="nav-dropdown">
				<button class="nav-dropdown-toggle" onclick="this.parentElement.classList.toggle('open')">Products <svg viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z"/></svg></button>
				<div class="nav-dropdown-menu">
					<a href="nano2.html">Nano²</a>
					<a href="mini.html">Mini</a>
					<a href="oem.html">OEM</a>
					<a href="boost.html">Boost</a>
					<a href="wearable.html">Wearable</a>
				</div>
			</div>
		</div>
		<div class="product-nav-cta">
			<a href="#">Technical features</a>
		</div>
	</nav>

	<section class="slides">
		<img src="assets/images/overview/slide-01.jpg" alt="Slide 1">
		<img src="assets/images/overview/slide-02.jpg" alt="Slide 2">
		<img src="assets/images/overview/slide-03.jpg" alt="Slide 3">
		<img src="assets/images/overview/slide-04.jpg" alt="Slide 4">
		<img src="assets/images/overview/slide-05.jpg" alt="Slide 5">
		<img src="assets/images/overview/slide-06.jpg" alt="Slide 6">
		<img src="assets/images/overview/slide-07.jpg" alt="Slide 7">
		<img src="assets/images/overview/slide-08.jpg" alt="Slide 8">
		<img src="assets/images/overview/slide-09.jpg" alt="Slide 9">
		<img src="assets/images/overview/slide-10.jpg" alt="Slide 10">
		<img src="assets/images/overview/slide-11.jpg" alt="Slide 11">
		<img src="assets/images/overview/slide-12.jpg" alt="Slide 12">
		<img src="assets/images/overview/slide-13.jpg" alt="Slide 13">
		<img src="assets/images/overview/slide-14.jpg" alt="Slide 14">
		<img src="assets/images/overview/slide-15.jpg" alt="Slide 15">
		<img src="assets/images/overview/slide-16.jpg" alt="Slide 16">
		<img src="assets/images/overview/slide-17.jpg" alt="Slide 17">
		<img src="assets/images/overview/slide-18.jpg" alt="Slide 18">
		<img src="assets/images/overview/slide-19.jpg" alt="Slide 19">
		<img src="assets/images/overview/slide-20.jpg" alt="Slide 20">
		<img src="assets/images/overview/slide-21.jpg" alt="Slide 21">
		<img src="assets/images/overview/slide-22.jpg" alt="Slide 22">
		<img src="assets/images/overview/slide-23.jpg" alt="Slide 23">
		<img src="assets/images/overview/slide-24.jpg" alt="Slide 24">
		<img src="assets/images/overview/slide-25.jpg" alt="Slide 25">
		<img src="assets/images/overview/slide-26.jpg" alt="Slide 26">
	</section>
</body>
</html>
<script>
(function() {
	document.addEventListener('click', function(e) {
		var dd = document.querySelector('.nav-dropdown');
		if (dd && !dd.contains(e.target)) dd.classList.remove('open');
	});
})();
</script>
